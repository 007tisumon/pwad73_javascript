<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Entry Form</title>
</head>

<body>
    <div class="">
        <h1>Product Entry Form</h1>
        <form action="">
            <div class="">
                <input placeholder="Product name" type="text" name="" id="">
            </div>
            <div class="">
                <textarea name="description" id="" placeholder="description"></textarea>
            </div>
            <div class="">
                <select>
                    <option value="">Man</option>
                    <option value="">Woman</option>
                    <option value="">Kids</option>
                </select>
            </div>
            <div class="">
                <strong>Features</strong>:
                Cotton <input type="checkbox" name="cotton" id="">
                Woolen <input type="checkbox" name="woolen" id="">
                Polyester <input type="checkbox" name="polyster" id="">
                Full Sleevs <input type="checkbox" name="sleevs" id="">

            </div>
            <div class="">
                Product photo: <input type="file" name="photo" id="">
            </div>
            <div class="">
                Stock: <input type="number" name="stock" id="">
            </div>
            <input type="submit" value="Submit">
        </form>
    </div>
</body>

</html>
