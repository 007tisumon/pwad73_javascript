<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <div class="cls" id="cls"></div>

    <script language="JavaScript">
        const person = {
            firstName: "John",
            lastName: "Doe",
            age: 50,
            eyeColor: "blue",
            address: {
                street: "123 Main St",
                city: "Anytown",
                state: "CA",
                zip: "12345"
            }
        };

        document.write(`Name: ${person.firstName} ${person.lastName}<br>`);
        document.write(`Age: ${person.age}<br>`); 
        document.write(`Eye Color: ${person.eyeColor}<br>`);
        document.querySelector(".cls").innerHTML = ` ${person.firstName} ${person.lastName}<br>Address: ${person.address.street}, ${person.address.city}, ${person.address.state} ${person.address.zip}`;
    </script>

</body>

</html>
