<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        const num = parseInt(prompt("Enter a number : "))
        function getPrime(n){
            if(n<=1){
                return `${n} is not prime number`
            }else if(n===2){
                return `${n} is a prime number`
            }else{
                for(let i=2; i<n; i++){
                    if(n%i===0){
                        console.log(n)
                        return `${n} is not prime number`
                    }
                }
                return `${n} is a prime number`
            }
        }

        document.write(getPrime(num))
    </script>
</body>
</html>
